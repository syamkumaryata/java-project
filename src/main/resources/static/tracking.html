<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tracking — College Bus Tracking System</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    #map-container {
      height: 540px;
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 1;
    }
    .tracking-stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-title">Live Bus Tracking</div>
        <div class="topbar-user">
          <span id="connection-badge" class="badge" style="background: var(--blue-100); color: var(--blue-700);">Connecting...</span>
          <span class="badge badge-simulated">Simulated GPS</span>
        </div>
      </header>

      <main class="content">
        <div class="tracking-stats">
          <div class="stat-chip">
            <span style="font-size: 0.75rem; color: var(--muted);">YOUR BUS</span>
            <strong id="stat-bus-num" style="font-size: 1.25rem; color: var(--blue-700);">Bus TN-2</strong>
          </div>
          <div class="stat-chip">
            <span style="font-size: 0.75rem; color: var(--muted);">ETA TO YOUR STOP</span>
            <strong id="stat-eta" style="font-size: 1.25rem; color: var(--ok);">Calculating...</strong>
          </div>
          <div class="stat-chip">
            <span style="font-size: 0.75rem; color: var(--muted);">SPEED</span>
            <strong id="stat-speed" style="font-size: 1.25rem;">35 km/h</strong>
          </div>
          <div style="margin-left: auto; display: flex; align-items: center; gap: 0.75rem;">
            <a href="/alternatives.html" class="btn btn-outline">🔄 Show Alternatives</a>
          </div>
        </div>

        <div id="map-container"></div>
      </main>
    </div>
    <div id="mobile-nav-container"></div>
  </div>

  <script type="module">
    import { requireAuth } from '/js/auth.js';
    import { renderNavigation } from '/js/nav.js';
    import { apiRequest } from '/js/api.js';
    import { TrackingSseClient } from '/js/sse.js';

    let map = null;
    let busMarker = null;
    let routePolyline = null;

    async function init() {
      const user = await requireAuth('STUDENT');
      if (!user) return;
      renderNavigation('tracking', user.role);

      // Initialize Leaflet Map (Centered on Tenali - Mangalagiri region)
      map = L.map('map-container').setView([16.35, 80.60], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Load route stops
      try {
        const routeData = await apiRequest('/api/student/route');
        const latlngs = [];

        routeData.stops.forEach((s, idx) => {
          if (s.latitude && s.longitude) {
            const pos = [s.latitude, s.longitude];
            latlngs.push(pos);

            const isCampus = s.isCampus;
            const isMyStop = s.isMyBoardingStop;

            const iconHtml = isCampus ? '🏛️' : (isMyStop ? '📍' : '🔵');
            const customIcon = L.divIcon({
              className: 'custom-map-marker',
              html: `<div style="font-size: 20px;">${iconHtml}</div>`,
              iconSize: [24, 24]
            });

            const marker = L.marker(pos, { icon: customIcon }).addTo(map);
            marker.bindPopup(`<b>${s.name}</b><br>Scheduled: ${s.scheduledTime}${isMyStop ? '<br>⭐ Your Boarding Stop' : ''}`);
          }
        });

        if (latlngs.length > 1) {
          routePolyline = L.polyline(latlngs, { color: '#2563EB', weight: 4 }).addTo(map);
          map.fitBounds(routePolyline.getBounds(), { padding: [40, 40] });
        }
      } catch (e) {
        console.error(e);
      }

      // Connect SSE
      const sse = new TrackingSseClient({
        onStatusChange: (status) => {
          const badge = document.getElementById('connection-badge');
          badge.textContent = status;
          if (status === 'Connected') {
            badge.style.background = '#DCFCE7';
            badge.style.color = '#15803D';
          } else {
            badge.style.background = '#FEF3C7';
            badge.style.color = '#B45309';
          }
        },
        onLocationUpdate: (loc) => {
          if (loc.latitude && loc.longitude) {
            const pos = [loc.latitude, loc.longitude];
            if (!busMarker) {
              const busIcon = L.divIcon({
                className: 'bus-marker',
                html: '<div style="font-size: 28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">🚌</div>',
                iconSize: [32, 32]
              });
              busMarker = L.marker(pos, { icon: busIcon }).addTo(map);
              busMarker.bindPopup(`<b>${loc.busNumber}</b><br><span class="badge badge-simulated">Simulated GPS</span>`);
            } else {
              busMarker.setLatLng(pos);
            }

            document.getElementById('stat-speed').textContent = `${Math.round(loc.speedKmph || 35)} km/h`;

            if (loc.etaToMyStopSec !== undefined) {
              if (loc.passedMyStop) {
                document.getElementById('stat-eta').textContent = 'Passed your stop';
                document.getElementById('stat-eta').style.color = 'var(--muted)';
              } else {
                const mins = Math.max(1, Math.round(loc.etaToMyStopSec / 60));
                document.getElementById('stat-eta').textContent = `~${mins} min`;
                document.getElementById('stat-eta').style.color = 'var(--ok)';
              }
            }
          }
        }
      });

      sse.connect();
    }

    init();
  </script>
</body>
</html>
