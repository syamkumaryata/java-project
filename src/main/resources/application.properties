# ============================================================
# College Bus Tracking System — Application Properties
# ============================================================

spring.application.name=college-bus-tracking-system

# Server
server.port=8080
server.servlet.context-path=/

# ── Database ─────────────────────────────────────────────────
# Database engine: 'mysql' or 'sqlite'
# Default: mysql (with automatic graceful fallback to sqlite if MySQL service is offline)
app.db.type=mysql

# MySQL 8 settings
spring.datasource.url=jdbc:mysql://localhost:3306/bustrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rishitha@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQLite database file path (used if app.db.type=sqlite or fallback)
app.db.path=${user.home}/bus-tracker-data/bustrack.db

# ── Session ──────────────────────────────────────────────────
# store: redis (default) | memory (tests only)
app.session.store=redis
app.session.ttl-minutes=30
app.session.max-hours=8
app.session.cookie-name=CBTS_SID

# ── Authentication ────────────────────────────────────────────
app.auth.mode=demo
app.auth.allowed-google-domains=
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.admin-emails=admin@example.test

# ── University Transport API ──────────────────────────────────
app.university-api.base-url=http://localhost:${server.port}
app.university-api.api-key=demo-api-key-change-in-prod
app.university-api.connect-timeout-ms=3000
app.university-api.read-timeout-ms=5000
app.university-api.retry-count=1

# ── GPS Simulation ────────────────────────────────────────────
app.simulation.tick-interval-ms=2000
app.simulation.default-mode=DEMO

# ── Alternative Bus Finder ────────────────────────────────────
app.alternatives.allow-cross-route-boarding=true

# ── Redis ─────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# ── Logging ───────────────────────────────────────────────────
logging.level.edu.busTracker=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.redis=WARN

# ── Jackson ───────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
